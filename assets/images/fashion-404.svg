<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCouture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1918"/>
      <stop offset="45%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#0D0C0B"/>
    </linearGradient>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D3AD"/>
      <stop offset="40%" stop-color="#B69A65"/>
      <stop offset="100%" stop-color="#7D6539"/>
    </linearGradient>
    <linearGradient id="fabricSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B69A65" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B69A65" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#B69A65" stop-opacity="0"/>
    </linearGradient>
    <filter id="coutureGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Editorial Canvas Background -->
  <rect width="900" height="1200" fill="url(#bgCouture)"/>

  <!-- Subtle Editorial Grain & Luxury Geometry Grid -->
  <g stroke="#B69A65" stroke-opacity="0.12" stroke-width="1" fill="none">
    <rect x="50" y="50" width="800" height="1100"/>
    <line x1="50" y1="200" x2="850" y2="200"/>
    <line x1="50" y1="1000" x2="850" y2="1000"/>
    <line x1="450" y1="50" x2="450" y2="1150"/>
    <circle cx="450" cy="550" r="320"/>
    <circle cx="450" cy="550" r="380" stroke-dasharray="3 6"/>
  </g>

  <!-- Giant Editorial 404 Watermark in Silhouette Backdrop -->
  <text x="450" y="640" font-family="'Playfair Display', serif" font-size="280" font-weight="700" fill="#201F1D" text-anchor="middle" letter-spacing="-10">404</text>

  <!-- High-Fashion Couture Silhouette (Draped Trench & Gown) -->
  <g filter="url(#coutureGlow)">
    <!-- Aura behind silhouette -->
    <ellipse cx="450" cy="550" rx="160" ry="260" fill="#B69A65" fill-opacity="0.06"/>
  </g>

  <!-- Model Body & Couture Garment Vector Silhouette -->
  <!-- Slender Head & Editorial Beret/Hat -->
  <path d="M450,230 C435,230 425,242 425,260 C425,280 435,295 450,295 C465,295 475,280 475,260 C475,242 465,230 450,230 Z" fill="#D8C398" opacity="0.9"/>
  <!-- Avant-Garde Sculpted Wide-Brim Editorial Hat -->
  <ellipse cx="450" cy="245" rx="110" ry="22" fill="#171717" stroke="url(#goldLuxury)" stroke-width="1.5" transform="rotate(-6 450 245)"/>
  <path d="M430,225 Q450,205 470,225 Z" fill="#171717"/>

  <!-- Graceful Elongated Neck -->
  <path d="M443,290 L443,330 L457,330 L457,290 Z" fill="#C5B187"/>

  <!-- Couture Garment Silhouette: Draped Wool Coat with Architectural Shoulders & Flared Hem -->
  <path d="M450,330 
           C405,335 340,365 330,420 
           C322,465 345,520 335,620 
           C320,740 270,910 240,1050 
           L660,1050 
           C630,910 580,740 565,620 
           C555,520 578,465 570,420 
           C560,365 495,335 450,330 Z" 
        fill="#211F1D" 
        stroke="url(#goldLuxury)" 
        stroke-width="1.5" 
        stroke-opacity="0.6"/>

  <!-- Tailored Waist Cinch & Belt -->
  <rect x="390" y="525" width="120" height="20" rx="3" fill="#121110" stroke="url(#goldLuxury)" stroke-width="1"/>
  <!-- Gold Buckle Accent -->
  <rect x="435" y="520" width="30" height="30" rx="2" fill="none" stroke="url(#goldLuxury)" stroke-width="2"/>
  <circle cx="450" cy="535" r="3" fill="#B69A65"/>

  <!-- Fluid Fabric Pleats & Gold Thread Accents -->
  <path d="M400,345 Q425,430 415,525 Q395,720 320,1050" fill="none" stroke="url(#goldLuxury)" stroke-width="1.2" stroke-opacity="0.5"/>
  <path d="M450,340 L450,525 L450,1050" fill="none" stroke="url(#goldLuxury)" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M500,345 Q475,430 485,525 Q505,720 580,1050" fill="none" stroke="url(#goldLuxury)" stroke-width="1.2" stroke-opacity="0.5"/>
  <path d="M360,425 Q385,500 375,640 Q350,830 280,1050" fill="none" stroke="url(#goldLuxury)" stroke-width="0.8" stroke-opacity="0.4"/>
  <path d="M540,425 Q515,500 525,640 Q550,830 620,1050" fill="none" stroke="url(#goldLuxury)" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Floating Editorial Magazine Badge Overlay inside SVG -->
  <g transform="translate(100, 110)">
    <rect width="260" height="36" fill="#171717" fill-opacity="0.9" stroke="#B69A65" stroke-width="1" rx="2"/>
    <circle cx="20" cy="18" r="4" fill="#B69A65"/>
    <text x="36" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#E5D3AD" letter-spacing="3">MISSING ARCHIVE PIECE</text>
  </g>

  <!-- Editorial Magazine Labels -->
  <text x="80" y="90" font-family="'Playfair Display', serif" font-size="16" font-style="italic" fill="#B69A65" letter-spacing="2">STACKLY Runway Monograph</text>
  <text x="820" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8F8C84" letter-spacing="4" text-anchor="end">CHAPTER IV</text>

  <g transform="translate(80, 1070)">
    <text x="0" y="0" font-family="'Playfair Display', serif" font-size="28" font-weight="500" fill="#FFFFFF" letter-spacing="2">THE UNFOUND LOOK</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#B69A65" letter-spacing="3">BESPOKE ARCHIVAL CATALOG // EDITION 2026</text>
  </g>

  <g transform="translate(820, 1070)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8F8C84" letter-spacing="2" text-anchor="end">ATELIER COORDINATE</text>
    <text x="0" y="24" font-family="'Playfair Display', serif" font-size="18" font-weight="600" fill="#D8C398" text-anchor="end">N° 404 / 500</text>
  </g>
</svg>